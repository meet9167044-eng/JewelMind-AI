# Alembic Configuration File
# =============================================================================
# This file is read by the alembic CLI. The sqlalchemy.url is intentionally
# left blank here because it is injected dynamically from backend/app/config.py
# in backend/alembic/env.py (see run_migrations_online).
# =============================================================================

[alembic]
script_location = backend/alembic

# Blank — overridden in env.py via settings.database_url
sqlalchemy.url =

# Path to migration versions
version_locations = backend/alembic/versions

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
